name: auto_draft
description: "Auto Draft by Excel to KML: survey points to a finished drawing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.8
  desktop_drop: ^0.8.4
  excel: ^4.0.6
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  pdf: ^3.12.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon-512.png
    - assets/samples/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700
