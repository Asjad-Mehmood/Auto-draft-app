    <circle cx="250" cy="396" r="10"/><circle cx="120" cy="372" r="10"/>
  </g>
  <!-- a tree symbol inside, as the app places it -->
  <circle cx="268" cy="262" r="46" fill="none" stroke="#F7D774" stroke-width="14"/>
  <path d="M268 230 V294 M236 262 H300" stroke="#F7D774" stroke-width="12" stroke-linecap="round"/>
