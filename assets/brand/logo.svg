<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#17386B"/>
      <stop offset="1" stop-color="#0A1A36"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9B949"/>
      <stop offset="0.55" stop-color="#F7D774"/>
      <stop offset="1" stop-color="#D9A233"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the drawing grid -->
  <g stroke="#E9B949" stroke-opacity="0.13" stroke-width="4">
    <line x1="96" y1="160" x2="416" y2="160"/><line x1="96" y1="256" x2="416" y2="256"/><line x1="96" y1="352" x2="416" y2="352"/>
    <line x1="160" y1="96" x2="160" y2="416"/><line x1="256" y1="96" x2="256" y2="416"/><line x1="352" y1="96" x2="352" y2="416"/>
  </g>
  <!-- the field points, joined by code into a plot outline -->
  <path d="M120 372 L196 150 L360 120 L398 300 L250 396 Z" fill="#E9B949" fill-opacity="0.16" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round"/>
  <!-- the surveyed points -->
  <g fill="#F7D774">
    <circle cx="196" cy="150" r="24"/><circle cx="360" cy="120" r="24"/><circle cx="398" cy="300" r="24"/>
    <circle cx="250" cy="396" r="24"/><circle cx="120" cy="372" r="24"/>
  </g>
  <g fill="#0A1A36">
